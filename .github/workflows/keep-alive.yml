name: Keep Cloud Backend Awake 24/7

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier idle spin down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          curl -s -f -m 30 "https://bodypower-teck.onrender.com/api/health" || echo "Ping attempted"
